<!DOCTYPE html>
<html>
<head>
    <title>Age Calculator</title>
</head>
<body>
    <h2>Age Calculator</h2>
    <form>
        <label>enter you birth date</label>
        <input type="date" id="birthYear" required>
        <button type="button" onclick="calculateAge()">Calculate Age</button>
    </form>
    <p id="result"></p>
    <script>
        function calculateAge() {
            let dob = new Date(document.getElementById("birthYear").value);
            let today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            if (today.getMonth() < dob.getMonth() ||(today.getMonth() == dob.getMonth() 
            &&today.getDate() < dob.getDate())
            ) {
                age--;
            }
            document.getElementById("result").innerHTML =
                "Your age is " + age + " years.";
        }
    </script>
</body>
</html>
