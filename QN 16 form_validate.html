<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
    <style>
        form{
            width: 400px;
            margin: auto;
        }
        input[type="text"],
        input[type="password"],
        input[type="url"],
        select{
            width: 100%;
            padding: 8px;
            margin: 5px 0;
        }
        .radio-group{
            margin: 5px 0;
        }
        button{
            padding: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
<h2 align="center">Student Registration Form</h2>
<form onsubmit="return validateForm()">
    <label>Name:</label>
    <input type="text" id="name">
    <label>Address:</label>
    <input type="text" id="address" required>
    <label>Username:</label>
    <input type="text" id="username">
    <label>Email:</label>
    <input type="text" id="email" required>
    <label>Password:</label>
    <input type="password" id="password">
    <label>Website:</label>
    <input type="url" id="website">
    <label>Phone:</label>
    <input type="text" id="phone">
    <label>Gender:</label><br>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <br>
    <label>Course:</label>
    <select id="course">
        <option value="">Select Course</option>
        <option>BIM</option>
        <option>BCA</option>
        <option>CSIT</option>
        <option>BBS</option>
    </select>
    <br><br>
    <button type="submit">Submit</button>
</form>
<script>
function validateForm()
{
    let name = document.getElementById("name").value.trim();
    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value;
    let phone = document.getElementById("phone").value.trim();
    let course = document.getElementById("course").value;
    if(name == "" || name.test(/\d/))
    {
        alert("Name must not be empty and should not contain numbers.");
        return false;
    }
    if(username == "" || username.test(!/^[A-Za-z0-9_]+$/))
    {
        alert("Username can contain only letters, numbers and underscore (_).");
        return false;
    }
    if(phone.test(!/^(98|97|96)\d{8}$/))
    {
        alert("Phone must start with 98, 97 or 96 and contain 10 digits.");
        return false;
    }
    let gender = document.getElementsByName("gender");
    let selected = false;

    for(let i=0; i<gender.length; i++)
    {
        if(gender[i].checked)
        {
            selected = true;
            break;
        }
    }
    if(!selected)
    {
        alert("Please select gender.");
        return false;
    }
    let passPattern =
    /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    if(!passPattern.test(password))
    {
        alert("Password must be at least 8 characters with uppercase, lowercase, number and special character.");
        return false;
    }
    if(course == "")
    {
        alert("Please select a course.");
        return false;
    }
    alert("Form Submitted Successfully!");
    return true;
}
</script>
</body>
</html>
