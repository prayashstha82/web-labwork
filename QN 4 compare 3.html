            let x = Number(document.getElementById("1st").value);
            let y = Number(document.getElementById("2nd").value);

            if(x<y&&z<y){

                    res.innerHTML="the greatest is "+y +"the smallest is "+z;
                }
                else{
                    res.innerHTML="the greatest is "+y +"the smallest is "+x;
                }
            }
            else if(x>y&&x>z){
                if(y<z){
                    res.innerHTML="The greatest is "+x +"<br>The smallest is "+y;
                }else{
                    res.innerHTML="The greatest is "+x +"<br>The smallest is "+z;
                }
            }
            else{
                if(x<y){
                   res.innerHTML="The greatest is "+z +"<br>The smallest is "+x; 
                }

        }
