<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        #main{
            width:300px;
            height:200px;
            border:1px solid black;
        }

        .thumb{
            width:100px;
            height:70px;
            cursor:pointer;
            margin:5px;
        }
    </style>
</head>
<body>
<h2>Image Gallery</h2>
<img id="main" src="image1.jpg">
<br><br>
<img class="thumb" src="image1.jpg">
<img class="thumb" src="image2.jpg">
<img class="thumb" src="image3.jpg">
<script>
$(".thumb").click(function(){
    $("#main").attr("src", $(this).attr("src"));
});
</script>
</body>
</html>
