<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Structure Page</title>
</head>
<body>
    <h1> All formatted text </h1>
    <b>This is bold</b><br>
    <strong>This is strong importance</strong><br>
    <i>This is italic</i><br>
    <em>This is emphasis</em><br>
    <q>This is quotation</q><br>
    <blockquote>This is block quotation</blockquote>
    <del>This is deleted text</del><br>
    <ins>This is inserted text</ins><br>
    <font color="blue">This is font tag</font><br>
    <pre>This is preformatted text</pre>
    <code>print("Hello")</code><br>
    <tt>This is teletype text</tt><br>
    HTML entities: &lt; &gt; &amp;<br>
    H<sub>2</sub>O<br>
    x<sup>2</sup>
</body>
</html>
