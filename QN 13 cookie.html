<!DOCTYPE html>
<html>
<head>
    <title>Cookie Example</title>
</head>
<body>

<h2>Cookie Operations</h2>

<button onclick="setCookie()">Store Cookie</button>
<button onclick="getCookie()">Read Cookie</button>
<button onclick="deleteCookie()">Delete Cookie</button>

<script>
function setCookie() {
    document.cookie = "username=Pawan; expires=Fri, 31 Dec 2027 23:59:59 UTC; path=/";
    alert("Cookie Stored Successfully");
}

function getCookie() {
    alert("Stored Cookies: " + document.cookie);
}

function deleteCookie() {
    document.cookie = "username=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/";
    alert("Cookie Deleted Successfully");
}
</script>

</body>
</html>
