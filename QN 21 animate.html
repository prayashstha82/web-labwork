<!DOCTYPE html>
<html>
<head>
    <title>jQuery Animate Example</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        #box {
            width: 100px;
            height: 100px;
            background-color: skyblue;
            position: relative;
        }
    </style>
</head>
<body>
    <button id="animate">Animate Box</button>
    <div id="box"></div>
    <script>
        $("#animate").click(function () {
            $("#box").animate({
                left: "200px",
                width: "200px"
            });
        });
    </script>
</body>

</html>
